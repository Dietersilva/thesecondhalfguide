name: Build retirement planner launch

on:
  push:
    branches:
      - feature/retirement-strategy-model-launch
    paths:
      - '_src/**'
      - '.github/workflows/build-retirement-planner-launch.yml'

permissions:
  contents: write

jobs:
  build-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/retirement-strategy-model-launch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply planner product branding
        run: python3 _src/brand_retirement_planner.py

      - name: Regenerate site from source
        run: python3 _src/publish.py

      - name: Commit generated launch pages
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build retirement planner launch pages [skip ci]"
          git push origin HEAD:feature/retirement-strategy-model-launch
