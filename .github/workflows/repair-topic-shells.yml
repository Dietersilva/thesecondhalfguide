name: Repair topic page shells

on:
  push:
    branches: [main]
    paths:
      - '_src/publish.py'
      - '.github/workflows/repair-topic-shells.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild site
        run: python3 _src/publish.py
      - name: Commit regenerated pages
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair shared shell on topic and search pages [skip ci]"
          git push origin HEAD:main
