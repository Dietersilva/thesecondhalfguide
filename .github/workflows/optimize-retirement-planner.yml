name: Optimize retirement planner performance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-retirement-planner.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize calculator engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [Path('retirement-strategy-model.js'), Path('_src/retirement-strategy-model.js')]
          for path in paths:
              s = path.read_text()

              # Reuse one currency formatter instead of constructing a new Intl formatter for every value.
              s = s.replace(
                  "const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number.isFinite(n)?n:0);",
                  "const MONEY_FMT=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});\nconst money=n=>MONEY_FMT.format(Number.isFinite(n)?n:0);"
              )

              # Cache AWI interpolation. The old function rebuilt and sorted the AWI year list on every call.
              interp_pattern = re.compile(r"function interp\(y\)\{.*?\}\nfunction cbb\(y\)", re.S)
              interp_repl = """const AWI_YEARS=Object.keys(AWI).map(Number).sort((a,b)=>a-b);\nconst INTERP_CACHE=new Map();\nfunction interp(y){if(INTERP_CACHE.has(y))return INTERP_CACHE.get(y);if(AWI[y]){INTERP_CACHE.set(y,AWI[y]);return AWI[y];}let lo=AWI_YEARS[0],hi=AWI_YEARS[AWI_YEARS.length-1];for(let i=0;i<AWI_YEARS.length-1;i++){if(y>AWI_YEARS[i]&&y<AWI_YEARS[i+1]){lo=AWI_YEARS[i];hi=AWI_YEARS[i+1];break;}}let v;if(y<lo)v=AWI[lo]/Math.pow(1.045,lo-y);else if(y>hi)v=AWI[hi]*Math.pow(1.038,y-hi);else{const t=(y-lo)/(hi-lo);v=AWI[lo]*Math.pow(AWI[hi]/AWI[lo],t);}INTERP_CACHE.set(y,v);return v;}\nfunction cbb(y)"""
              s, n = interp_pattern.subn(interp_repl, s, count=1)
              if n != 1:
                  raise SystemExit(f'Could not replace interp in {path}')

              # Cache PIA estimates by the person's actual inputs. This is reused dozens of times per render.
              pia_pattern = re.compile(r"function quickPia\(p\)\{.*?\}\nfunction monthly\(age,p\)", re.S)
              old = pia_pattern.search(s)
              if not old:
                  raise SystemExit(f'Could not locate quickPia in {path}')
              body = old.group(0)
              quick = body[:-len("\nfunction monthly(age,p)")]
              # Turn the existing function into a calculation helper, then wrap with memoization.
              calc = quick.replace('function quickPia(p){', 'function quickPiaCalc(p){', 1)
              cached = calc + "\nconst PIA_CACHE=new Map();\nfunction quickPia(p){const k=[p.birthYear,p.retireAge,p.wages,p.futureWages,p.years,p.override,p.overrideAge].join('|');if(PIA_CACHE.has(k))return PIA_CACHE.get(k);const v=quickPiaCalc(p);PIA_CACHE.set(k,v);return v;}\nfunction monthly(age,p)"
              s = s[:old.start()] + cached + s[old.end():]

              # Debounce number/text input updates. Selects, radios and checkboxes still update immediately.
              old_init = "function init(){populateMonths();ensureValuePanels();previewLinks();document.querySelectorAll('.rsm-page input,.rsm-page select').forEach(e=>{e.addEventListener('input',render);e.addEventListener('change',render);});$('print-report')?.addEventListener('click',()=>window.print());$('rsm-reset')?.addEventListener('click',()=>location.reload());render();}"
              new_init = "let renderTimer=0;function scheduleRender(){clearTimeout(renderTimer);renderTimer=setTimeout(()=>requestAnimationFrame(render),180);}function immediateRender(){clearTimeout(renderTimer);requestAnimationFrame(render);}function init(){populateMonths();ensureValuePanels();previewLinks();document.querySelectorAll('.rsm-page input,.rsm-page select').forEach(e=>{const live=e.matches('input[type=number],input[type=text],input[type=month]');if(live)e.addEventListener('input',scheduleRender);e.addEventListener('change',immediateRender);});$('print-report')?.addEventListener('click',()=>window.print());$('rsm-reset')?.addEventListener('click',()=>location.reload());render();}"
              if old_init not in s:
                  raise SystemExit(f'Could not replace init in {path}')
              s = s.replace(old_init, new_init, 1)

              path.write_text(s)
          PY
      - name: Commit optimized engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retirement-strategy-model.js _src/retirement-strategy-model.js
          git commit -m "Speed up retirement planner calculations [skip ci]"
          git push origin HEAD:main
