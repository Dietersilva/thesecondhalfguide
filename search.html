<script type="application/json" id="search-data">[{"t":"The ACA subsidy cliff is back in 2026","d":"The enhanced ACA premium tax credits expired at the end of 2025. What that means for marketplace premiums in 2026, and where the subsidy cliff now sits.","u":"/aca-subsidy-cliff"},{"t":"Advantage or Original: what actually differs","d":"Medicare Advantage or Original Medicare: what each one is, how the money works, and the one decision that gets much harder to reverse later on.","u":"/advantage-vs-original"},{"t":"Aging in place","d":"Every article on staying home safely \u2014 the home changes that matter, falls prevention, downsizing math, driving, and which upgrades are just upsells.","u":"/aging"},{"t":"Aging in place: staying home is a goal, not a plan","d":"&ldquo;I\u2019m never leaving this house&rdquo; sounds like a decision about a house. It\u2019s mostly a decision about stairs, driving, and who lives near enough to help.","u":"/aging-in-place"},{"t":"The airport help you\u2019re entitled to, and nobody mentions","d":"Wheelchairs, escorts through the terminal, help through security \u2014 all free and yours by law. Almost entirely unused, because nobody tells you.","u":"/airport-help"},{"t":"The airport rule that went away, and what PreCheck still buys you","d":"TSA ended the shoes-off rule for everyone in July 2025, deleting the one screening benefit of turning 75. What PreCheck and Global Entry still buy you.","u":"/airport-security"},{"t":"Approaching 60 and beyond: what actually changes, and what doesn't","d":"What actually changes as you approach 60: the deadlines worth a calendar entry, the thresholds that matter, and the many that are only marketing.","u":"/approaching-60"},{"t":"The phone call that empties bank accounts &mdash; and the one sentence that stops it","d":"How the bank impostor call works, why it defeats careful people, and the one sentence that stops it \u2014 plus what to do if one has already reached you.","u":"/bank-imposter-scam"},{"t":"Your beneficiary form may outrank your will","d":"A will is the document everyone has heard of. For a lot of households, it isn\u2019t the one that decides where the largest accounts go.","u":"/beneficiary-form"},{"t":"The four-year 401(k) catch-up window at 60&ndash;63","d":"For four calendar years only, ages 60\u201363, the 401(k) catch-up jumps to $11,250 instead of $8,000 \u2014 if your plan opts in, and if you know to ask.","u":"/catch-up-60-63"},{"t":"The COBRA-to-Medicare trap","d":"COBRA keeps your health plan going after a job ends, but it isn\u2019t creditable coverage for Medicare Part B \u2014 missing that risks a permanent penalty.","u":"/cobra-medicare-trap"},{"t":"The COLA: why a raise doesn\u2019t feel like one","d":"Social Security rose 2.8% for 2026. For an average retired worker on the standard Part B premium, Medicare took back about a third before it arrived.","u":"/cola"},{"t":"Social Security&rsquo;s fast track for a severe diagnosis","d":"SSA added 14 conditions to its Compassionate Allowances list on August 11, 2026, bringing the total to 314. How the disability fast track actually works.","u":"/compassionate-allowances"},{"t":"What happens if you get sick on a cruise","d":"There is a doctor on board, they bill you, and Medicare almost certainly does not apply. What shipboard care costs, and what evacuation can run to.","u":"/cruise-medical"},{"t":"What delaying Social Security actually adds to your check","d":"Waiting past full retirement age adds 8% a year to your Social Security check, up to 24% at 70. The published SSA rule, not a hidden bonus.","u":"/delayed-retirement-credit"},{"t":"Who gets your digital life when you die?","d":"Photographs, bills and password resets now live behind a login \u2014 and a password is not the same as permission. What an executor can actually reach.","u":"/digital-estate"},{"t":"Downsizing: the arithmetic people skip","d":"Selling a big house and buying a small one may free up less than you think. The costs that decide it are the ones nobody puts in the spreadsheet.","u":"/downsizing-math"},{"t":"The driving conversation","d":"Age alone is a poor predictor of who should stop driving. The specific, checkable things that are better ones \u2014 and the road in between the two.","u":"/driving"},{"t":"The $2,100 drug cap: real protection, narrower than it sounds","d":"Part D prescription costs now have a hard annual ceiling of $2,100. A genuinely big change \u2014 and \u201cout-of-pocket cap\u201d is doing a lot of work.","u":"/drug-cap"},{"t":"Why your phone rings more in October","d":"Open enrollment is the one season when unsolicited Medicare contact feels normal. That is what makes it the most profitable weeks of the fraud year.","u":"/enrollment-scams"},{"t":"Falls: the numbers, and what actually reduces them","d":"More than one in four older adults falls each year and fall deaths are up 51% in a decade. The best-supported prevention costs nothing at all.","u":"/falls"},{"t":"Grandparenting &amp; family","d":"Every article on grandparenting and staying close to family in one place \u2014 the boundaries, the distance, and the fiction column, Wednesday Letters.","u":"/family"},{"t":"The five-minute rule: why scammers need you to act right now","d":"Modern fraud isn\u2019t an intelligence test. It\u2019s an attack on your decision time &mdash; which is why one boring habit beats memorising every scam.","u":"/five-minute-rule"},{"t":"Scam &amp; fraud protection","d":"Every scam and fraud-protection article on the site in one place \u2014 the current phone, email and gift-card scams, and exactly what to do if one gets through.","u":"/fraud"},{"t":"Most states will let you take college classes free after 60","d":"Most states let older residents take public-college courses free or cheaply. Rules vary by state, campus, age, and whether you audit or take credit.","u":"/free-college"},{"t":"The &ldquo;go-go years&rdquo; are real, but they\u2019re not a deadline","d":"Retirement planners split later life into go-go, slow-go and no-go. There\u2019s something to it &mdash; and it has quietly turned a lot of 60s into a countdown clock.","u":"/go-go-years"},{"t":"When the scammer sends someone to your door","d":"The FBI logged about 725 gold-courier frauds in 2025, with $311.8 million lost and 98% of it by people over 60. It ends with a stranger at your door.","u":"/gold-courier-scam"},{"t":"Hearing aids: what the over-the-counter rule actually changed","d":"For decades a pair cost as much as a used car and required an audiologist. Since 2022 you can buy them off a shelf &mdash; and the price floor fell through.","u":"/hearing-aids"},{"t":"The HSA rule that can cost you a 6% tax at 65","d":"Still working past 65 with an HSA? Enrolling in Medicare later can retroactively tax contributions already made. The 6-month rule that avoids the 6% penalty.","u":"/hsa-medicare-timing"},{"t":"The Medicare surcharge based on what you earned two years ago","d":"IRMAA 2026: the Medicare surcharge set by your income from two years ago. The thresholds, why it is a cliff not a slope, and the form that appeals it.","u":"/irmaa"},{"t":"The new long-distance grandparent","d":"Living far from grandchildren changes the mechanics of closeness, not the closeness itself. What has to be built rather than simply absorbed.","u":"/long-distance"},{"t":"Long-term care: the numbers, before the sales pitch","d":"What long-term care actually costs in 2026, who pays for it, and what insurance does and does not do. One of the largest risks in retirement.","u":"/long-term-care"},{"t":"Medicare &amp; health insurance","d":"Every Medicare and health-insurance article in one place \u2014 enrollment windows, the drug cap, IRMAA, Medigap, and where Medicare stops working.","u":"/medicare"},{"t":"The other Medicare enrollment window, in January","d":"A second Medicare enrollment window opens every January, separate from fall\u2019s AEP \u2014 but only for people already on Medicare Advantage, and only once.","u":"/medicare-advantage-oep"},{"t":"The new Medicare card scam, and the real reissue behind it","d":"CMS reissued 1.3 million Medicare numbers this spring after a security incident. The real reissue and the scam script copying it, side by side.","u":"/medicare-card-scam"},{"t":"The Medicare deadline that never forgives you","d":"Miss your Medicare enrollment window without the right coverage and you pay a surcharge every month for life. The seven months that decide it.","u":"/medicare-enrollment"},{"t":"What Medicare doesn\u2019t cover","d":"What Medicare does not cover: teeth, eyes, ears, and the very large one most people do not discover until a parent needs it. Worth knowing early.","u":"/medicare-gaps"},{"t":"The Medicare help millions qualify for and never claim","d":"Four Medicare Savings Programs help with premiums and deductibles, plus Extra Help for drug costs. The 2026 income limits are higher than most assume.","u":"/medicare-savings"},{"t":"The six months that decide whether you can ever buy Medigap","d":"The one-time six-month Medigap window: when it starts, what guaranteed issue means, and what insurers may ask about your health once it closes.","u":"/medigap-window"},{"t":"Money &amp; the tax year","d":"Every dated fact about taxes, deductions and Social Security \u2014 the senior deduction, RMDs, IRMAA, the Medigap window, and thresholds that move yearly.","u":"/money"},{"t":"&ldquo;No tax on Social Security&rdquo;: what the law actually did","d":"The 2025 law created a $6,000 deduction for people over 65. It did not change how Social Security is taxed \u2014 those thresholds are frozen since 1984.","u":"/no-tax-on-social-security"},{"t":"Three nights in a hospital bed, and Medicare says you were never admitted","d":"Observation is a billing status, not a place. Why three hospital nights may not count toward Medicare's three-day rule, and the appeal opened in 2025.","u":"/observation-status"},{"t":"Being available without being on call","d":"Grandparenting can be the best thing about this decade. It can also become a job nobody remembers offering you, and that nobody remembers accepting.","u":"/on-call"},{"t":"Open enrollment: what the 15 October window is actually for","d":"Your plan is allowed to change its costs, its drug list and its doctors every January. Fall is the only time most people can respond &mdash; and most don\u2019t.","u":"/open-enrollment"},{"t":"The Social Security overpayment letter, and the deadline inside it","d":"SSA can now withhold up to 50% of your monthly check to recover an overpayment. Two deadlines inside the letter \u2014 30 and 60 days \u2014 decide when that starts.","u":"/overpayment-clawback"},{"t":"Paperwork that matters","d":"Every article on wills, beneficiary forms, digital accounts and power of attorney \u2014 explained without the law-school vocabulary, in one place.","u":"/paperwork"},{"t":"Is the National Parks Senior Pass still one of America\u2019s best deals?","d":"$80 for life, starting at 62. The headline is as good as it sounds &mdash; but the word &ldquo;parks&rdquo; misleads people about what they\u2019re actually buying.","u":"/parks-pass"},{"t":"The passport rules that turn people away at check-in","d":"A valid passport is not always a usable one. The rule that catches people has nothing to do with the expiry date printed inside it.","u":"/passport-traps"},{"t":"Power of attorney: the document for while you\u2019re still here","d":"A will handles what happens after you die. It does nothing for the far more likely problem &mdash; being alive, and temporarily unable to sign anything.","u":"/power-of-attorney"},{"t":"The property tax break you might already qualify for","d":"Most states reduce, freeze or defer property taxes at a certain age. Almost none apply it automatically, and the age is lower than people assume.","u":"/property-tax"},{"t":"The withdrawal the IRS requires, and the deadline that costs 25%","d":"Required minimum distributions in 2026: the age by birth year, the first-year trap, the 25% penalty, and the charitable route that skips the tax.","u":"/rmd-deadline"},{"t":"Romance scams after 55: intelligence was never the issue","d":"The strongest ones don\u2019t begin with a request for money. They begin with six months of someone remembering your grandchildren\u2019s names.","u":"/romance-scams"},{"t":"The Rule of 55: what it actually covers","d":"Leave a job at 55 or later and you may tap that employer\u2019s 401(k) penalty-free. The IRS rule, the rollover trap that cancels it, and what still gets taxed.","u":"/rule-of-55"},{"t":"55, 60, 62, 65: when does &ldquo;senior&rdquo; actually start?","d":"There is no senior birthday. About a dozen unrelated clocks \u2014 50, 55, 59\u00bd, 62, 65, 67 \u2014 set by different institutions, and only some of them matter.","u":"/senior-age"},{"t":"The new $6,000 senior deduction, explained","d":"The new $6,000 senior deduction for people 65 and over \u2014 temporary, income-limited, and widely misdescribed as \u201cno tax on Social Security.\u201d","u":"/senior-deduction"},{"t":"The $75,000 line, and what the senior deduction is worth above it","d":"The $6,000 senior deduction shrinks by six cents per dollar above $75,000 single or $150,000 joint, and reaches zero at $175,000. The arithmetic.","u":"/senior-deduction-phaseout"},{"t":"The senior deduction ends after 2028","d":"The $6,000 senior deduction applies to tax years 2025 through 2028 and then ends. What that means for timing a conversion or a sale.","u":"/senior-deduction-sunset"},{"t":"Should you file for Social Security at 62? Here's what the math actually says","d":"Filing for Social Security at 62 cuts your benefit permanently. The arithmetic \u2014 the reduction, the break-even, and when filing early still wins.","u":"/social-security-62"},{"t":"Locked out of your Social Security account","d":"Your old Social Security username and password no longer work. Nothing went wrong \u2014 the sign-in system changed, and getting back in takes 20 minutes.","u":"/social-security-login"},{"t":"Social Security spousal benefits: what you&rsquo;re actually entitled to","d":"Married or divorced, you may be owed a Social Security benefit based on a spouse\u2019s record \u2014 up to half, not on top of your own. The rules that decide it.","u":"/spousal-benefits"},{"t":"Your SSI wage reports just became automatic","d":"SSA\u2019s Payroll Information Exchange now reports many SSI and SSDI recipients\u2019 wages automatically each month. What still has to be reported by hand.","u":"/ssi-wage-reporting"},{"t":"What someone over 65 can actually deduct in 2026","d":"Three separate deductions stack for someone over 65 in 2026: the base, the age-65 addition, and the new $6,000. Together, more than most expect.","u":"/standard-deduction-65"},{"t":"The big trip, done right","d":"Not where to go &mdash; you know where you want to go. The logistics that decide whether the trip you have been imagining for years actually works.","u":"/the-big-trip"},{"t":"Travel &amp; discounts","d":"Every travel and discount article on the site \u2014 airport security, passport rules, cruise medical coverage, and where the real senior discounts are.","u":"/travel"},{"t":"Travel insurance after 60: what are you actually buying?","d":"It gets sold as one checkbox at the end of a booking. It\u2019s at least four different products &mdash; and the one most people over 65 need isn\u2019t the one they think.","u":"/travel-insurance"},{"t":"Flying with medications and medical equipment","d":"Most of it is easier than people fear. One thing is a hard no, and a few require paperwork weeks in advance &mdash; which is the part that ruins trips.","u":"/travel-medications"},{"t":"The vaccine schedule nobody hands you","d":"Children get a schedule on a card. Adults get nothing &mdash; despite several vaccines now starting at 50, and most of them costing nothing on Medicare.","u":"/vaccine-ages"},{"t":"When the voice really does sound like your grandchild","d":"The grandparent scam had one reliable flaw: the caller never sounded right. Voice cloning removed it. What still works has nothing to do with the voice.","u":"/voice-cloning"},{"t":"The Wednesday Letters","d":"Fiction from The Second Half Guide: twenty-one years of Wednesday mornings at a small-town post office, and the letters that kept on arriving.","u":"/wednesday-letters"},{"t":"The free Medicare visit that isn&rsquo;t a physical","d":"You get one every year at no cost. It is not a physical, which is the source of most of the confusion &mdash; and of most of the surprise bills.","u":"/wellness-visit"},{"t":"The pension rule that cut your Social Security is gone","d":"WEP and GPO cut the Social Security of teachers, firefighters and public employees for decades. Both were repealed, and many affected still don't know.","u":"/wep-gpo-repeal"},{"t":"The widow\u2019s penalty","d":"When one spouse dies, income falls and the tax brackets narrow at the same time. One of the harshest bits of arithmetic in retirement, rarely explained.","u":"/widows-penalty"}]</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('search-data').textContent);
  var input = document.getElementById('q');
  var results = document.getElementById('results');
  var status = document.getElementById('search-status');
  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase();
    if (q.length < 2) {
      results.innerHTML = '';
      status.textContent = 'Type at least 2 letters to see results.';
      status.hidden = false;
      return;
    }
    var titleHits = [], descHits = [];
    for (var i = 0; i < data.length; i++) {
      var item = data[i];
      if (item.t.toLowerCase().indexOf(q) !== -1) { titleHits.push(item); }
      else if (item.d.toLowerCase().indexOf(q) !== -1) { descHits.push(item); }
    }
    var hits = titleHits.concat(descHits);
    if (hits.length === 0) {
      results.innerHTML = '';
      status.textContent = 'No matches. Try a shorter or different word.';
      status.hidden = false;
      return;
    }
    status.hidden = true;
    var html = '';
    for (var j = 0; j < hits.length; j++) {
      html += '<a class="search-result" href="' + hits[j].u + '">'
        + '<span class="search-result-title">' + hits[j].t + '</span>'
        + '<span class="search-result-desc">' + hits[j].d + '</span>'
        + '</a>';
    }
    results.innerHTML = html;
  });
})();
</script>
